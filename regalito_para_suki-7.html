<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para mi niña hermosa 💗</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:#06110f;color:#fff;overflow:hidden;font-family:Georgia,serif}
  body{min-height:100svh;background:radial-gradient(ellipse at 50% 75%,#10251d 0%,#071310 48%,#030908 100%);position:relative;cursor:pointer}
  .stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:radial-gradient(#b7ffd2 1px,transparent 1.8px),radial-gradient(#ffb8e6 1.5px,transparent 2px);background-size:73px 91px,127px 143px;background-position:15px 20px,42px 55px;opacity:.25;animation:twinkle 4s ease-in-out infinite alternate}
  .stars:before{background-size:119px 111px;opacity:.3;transform:translateY(18px)}
  @keyframes twinkle{from{opacity:.12}to{opacity:.48}}
  .hint{position:absolute;top:7%;width:100%;text-align:center;padding:0 18px;color:#ffd9f0;font:14px Arial,sans-serif;letter-spacing:1px;opacity:.9;animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .message{position:absolute;top:15%;left:5%;width:90%;min-height:100px;text-align:center;color:#ff91d3;text-shadow:0 0 8px #f04cb8,0 0 20px #b018d6;font-size:clamp(23px,5.8vw,38px);font-weight:bold;line-height:1.35;z-index:3}
  .garden{position:absolute;bottom:0;left:50%;width:min(100vw,500px);height:45vh;transform:translateX(-50%);opacity:0;transition:opacity 2s ease;z-index:2}
  .garden.show{opacity:1}
  svg{width:100%;height:100%;overflow:visible;display:block}
  .stem{fill:none;stroke:#168c48;stroke-width:7;stroke-linecap:round;stroke-dasharray:500;stroke-dashoffset:500;filter:drop-shadow(0 0 5px #39ff9b)}
  .garden.show .stem{animation:grow 3s ease forwards}
  @keyframes grow{0%{stroke-dashoffset:500;opacity:.25}100%{stroke-dashoffset:0;opacity:1}}
  .leaf{fill:#159b4e;stroke:#39e98a;stroke-width:1;filter:drop-shadow(0 0 5px #0a702e);opacity:0;transform-box:fill-box;transform-origin:center}
  .garden.show .leaf{animation:leafIn 1.1s ease forwards}
  @keyframes leafIn{0%{opacity:0;transform:scale(.1) rotate(-20deg)}70%{opacity:1;transform:scale(1.05) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  .petal{fill:#ff83c8;stroke:#ffb6e0;stroke-width:1.5;filter:drop-shadow(0 0 8px #ff59bd)}
  .center{fill:#ffe8a3;filter:drop-shadow(0 0 8px #ffb4df)}
  .flower{opacity:0;transform-box:fill-box;transform-origin:center bottom}
  .garden.show .flower{animation:flowerAppear 2.4s ease forwards}
  .lily{opacity:0;transform-box:fill-box;transform-origin:bottom center}
  .garden.show .lily{animation:lilyAppear 2.8s ease forwards}
  @keyframes flowerAppear{0%{opacity:0;filter:drop-shadow(0 0 0 transparent)}45%{opacity:.75}100%{opacity:1;filter:drop-shadow(0 0 7px #ff63bf)}}
  @keyframes lilyAppear{0%{opacity:0}100%{opacity:.9}}
  .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffb6e0;box-shadow:0 0 10px 3px #ff63bf;animation:float 4s linear infinite;opacity:0}
  .garden.show ~ .spark{opacity:.8}
  @keyframes float{0%{transform:translateY(30px) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translateY(-170px) scale(1.2);opacity:0}}
  .footer{position:absolute;bottom:3%;left:0;width:100%;text-align:center;font:12px Arial,sans-serif;color:#c9e8d6;opacity:.75;padding:0 14px;z-index:4}
  .petal-fall{position:absolute;top:-12vh;z-index:2;pointer-events:none;color:#ffacd9;text-shadow:0 0 7px #ff64c3,0 0 16px #ff64c3;animation:fall linear infinite;opacity:.9}
  @keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}10%{opacity:.95}90%{opacity:.8}100%{transform:translate3d(var(--drift),115vh,0) rotate(640deg);opacity:0}}
  .glow-dot{position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:#ffb2e0;box-shadow:0 0 8px 3px #ff70c7,0 0 18px 5px #e947a8;pointer-events:none;animation:glowPulse 2.4s ease-in-out infinite alternate}
  @keyframes glowPulse{from{opacity:.25;transform:scale(.65)}to{opacity:1;transform:scale(1.4)}}
  .ground-glow{position:absolute;bottom:0;left:50%;width:80vw;height:25vh;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,85,190,.12),transparent 70%);pointer-events:none}

  .music-note{position:absolute;right:15px;top:14px;font:12px Arial,sans-serif;color:#ffd9f0;border:1px solid #ff91d366;border-radius:20px;padding:7px 10px;z-index:5}
  #player{position:absolute;width:1px;height:1px;opacity:.01;left:-10px;bottom:0}
  @media(min-height:800px){.garden{height:45vh}.message{top:16%}}
</style>
</head>

<script>
const first = "Para ti mi niña hermosa, espero te guste mi amor, te amo mucho suki💕";
const second = "Tú eres más hermosa que las flores mi amor, te amo mucho sukiii💗🫶🏾";
let started=false, playerReady=false, player;
function typeText(text, done){
 const box=document.getElementById('message'); box.textContent=''; let i=0;
 const timer=setInterval(()=>{box.textContent+=text.charAt(i);i++;if(i>=text.length){clearInterval(timer);if(done)done();}},65);
}
function loadMusic(){
 if(window.YT && YT.Player){createPlayer();return;}
 if(!document.getElementById('yt-api')){
  const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
 }
}
function createPlayer(){
 if(player) return;
 player=new YT.Player('player',{height:'1',width:'1',videoId:'9wiEM0s4aCQ',
  playerVars:{autoplay:1,playsinline:1,controls:0,loop:1,playlist:'9wiEM0s4aCQ'},
  events:{onReady:(event)=>{playerReady=true;try{event.target.setVolume(75);event.target.playVideo();}catch(e){}}}});
}
window.onYouTubeIframeAPIReady=createPlayer;
function startMusic(){
 loadMusic();
 // Retry after YouTube's iframe API/player has initialized.
 let tries=0; const t=setInterval(()=>{
  tries++;
  if(playerReady){try{player.playVideo();}catch(e){} clearInterval(t);}
  if(tries>40)clearInterval(t);
 },250);
 document.getElementById('musicStatus').textContent='♫ Lover Is a Day — Cuco';
}
function createDecorations(){
 const petals=document.getElementById('fallingPetals');
 const dots=document.getElementById('glowDots');
 for(let i=0;i<24;i++){
  const p=document.createElement('div');p.className='petal-fall';
  p.textContent=['✿','❀','♥','✾'][i%4];
  p.style.left=(Math.random()*100)+'vw';
  p.style.fontSize=(12+Math.random()*13)+'px';
  p.style.animationDuration=(7+Math.random()*8)+'s';
  p.style.animationDelay=(-Math.random()*12)+'s';
  p.style.setProperty('--drift',((Math.random()-.5)*160)+'px');
  petals.appendChild(p);
 }
 for(let i=0;i<30;i++){
  const d=document.createElement('div');d.className='glow-dot';
  d.style.left=(4+Math.random()*92)+'vw';d.style.top=(18+Math.random()*76)+'vh';
  d.style.animationDelay=(Math.random()*2.5)+'s';
  dots.appendChild(d);
 }
}
function beginGift(){
 if(started)return;
 started=true;
 createDecorations();
 document.getElementById('hint').textContent='';
 document.getElementById('garden').classList.add('show');
 startMusic();
 typeText(first,()=>{
   setTimeout(()=>typeText(second),2200);
 });
}
document.body.addEventListener('click',beginGift,{passive:true});
</script>
</body>
</html>
